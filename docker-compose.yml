services:
    nginx:
        build: .
        restart: unless-stopped
        # environment:
            # MODSECURITY_ENGINE: DetectionOnly
            # MODSEC_AUDIT_RETENTION_DAYS: 30
            # MODSEC_AUDIT_MAX_SIZE_MB: 0
            # MODSEC_AUDIT_MAX_SIZE_GB: 1
            # RATE_LIMIT_ZONE_NAME: perip
            # RATE_LIMIT_ZONE_SIZE: 10m
            # RATE_LIMIT_RATE: 10r/s
            # RATE_LIMIT_BURST: 20
            # RATE_LIMIT_STATUS: 429
            # CLIENT_MAX_BODY_SIZE: 10m
            # KEEPALIVE_TIMEOUT: 65
            # CLIENT_BODY_TIMEOUT: 60
            # CLIENT_HEADER_TIMEOUT: 60
            # SEND_TIMEOUT: 60
            # PROXY_CONNECT_TIMEOUT: 5
            # PROXY_READ_TIMEOUT: 60
            # PROXY_SEND_TIMEOUT: 60
        ports:
            - "8080:80"
        volumes:
            - ./data/logs/modsecurity/audit:/var/log/modsecurity/audit
            - ./data/cache:/var/cache/nginx
        read_only: true
        tmpfs:
            - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1770,uid=101,gid=101
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        sysctls:
            net.ipv4.ip_unprivileged_port_start: 0
        pids_limit: 100
        mem_limit: 1g
        cpus: 2.0
        stop_grace_period: 30s
        healthcheck:
            test: ["CMD", "busybox", "nc", "-z", "-w", "2", "127.0.0.1", "80"]
            interval: 30s
            timeout: 3s
            start_period: 10s
            retries: 3
